name: check
on: [push, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, namespace-profile-linux-amd64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: boot chain
        run: |
          cat /proc/cmdline
          sudo dmesg | grep -E 'devtmpfs|Run .* as init|initramfs|initrd' || true
          ls -la /nsc/internal 2>&1 | head -5 || true
      - name: arch-chroot
        run: |
          docker run --rm --privileged archlinux:latest bash -c '
            pacman -Sy --noconfirm --needed arch-install-scripts >/dev/null 2>&1
            mkdir /r && mount --bind / /r
            arch-chroot /r bash -c "ls -la /dev/fd /dev/stdin 2>&1; diff <(echo a) <(echo a) && echo arch-chroot process substitution OK || echo arch-chroot process substitution FAILED"
          '
