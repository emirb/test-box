name: check
on: [push, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          uname -r; cat /proc/1/comm
          awk '$2=="/dev"' /proc/mounts
          ls -la /dev/fd /dev/stdin /dev/stdout /dev/stderr || true
          diff <(echo a) <(echo a) && echo "process substitution OK"
          echo hi | cat /dev/stdin
          sudo mkdir -p /mnt/dt
          sudo mount -t devtmpfs udev /mnt/dt
          ls -la /mnt/dt/fd /mnt/dt/stdin /mnt/dt/stdout /mnt/dt/stderr || true
          sudo umount /mnt/dt
